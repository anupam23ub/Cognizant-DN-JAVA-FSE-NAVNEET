# ============================================================================
# Exercise 1: H2 database connection (values taken from the assignment doc)
# ============================================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Schema management + visibility
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ============================================================================
# Exercise 10: Hibernate-specific tuning + batch processing
# ============================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# ============================================================================
# Exercise 9: example of EXTERNALIZED configuration. Any of the values above
# can be overridden via environment variables, command-line args or an
# external application.properties without recompiling, e.g.:
#   --spring.datasource.url=jdbc:h2:mem:other
# ============================================================================
