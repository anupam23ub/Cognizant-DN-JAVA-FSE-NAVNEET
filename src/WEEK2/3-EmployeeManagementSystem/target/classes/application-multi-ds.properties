# ============================================================================
# Exercise 9: activated only under the "multi-ds" profile.
#   mvn spring-boot:run -Dspring-boot.run.profiles=multi-ds
#
# Primary data source (auto-configured) - reuse the in-memory testdb.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Secondary data source - consumed by SecondaryDataSourceConfig.
app.secondary.datasource.jdbc-url=jdbc:h2:mem:reportingdb
app.secondary.datasource.driver-class-name=org.h2.Driver
app.secondary.datasource.username=sa
app.secondary.datasource.password=password
# ============================================================================
