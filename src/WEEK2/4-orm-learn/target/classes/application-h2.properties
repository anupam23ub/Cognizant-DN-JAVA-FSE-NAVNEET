# ===========================================================================
# orm-learn - H2 profile (zero-install alternative for graders)
# ===========================================================================
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Schema + seed data are loaded from the classpath copies of the SQL scripts
# (src/main/resources/db). create-drop builds the schema fresh each run.
# ===========================================================================

spring.datasource.url=jdbc:h2:mem:ormlearn;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run the SQL scripts (schema then data) on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/01-schema.sql
spring.sql.init.data-locations=classpath:db/02-country-data.sql,classpath:db/03-stock-data.sql,classpath:db/04-payroll-data.sql,classpath:db/05-quiz-data.sql
# defer datasource init until Hibernate has validated/loaded mappings
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.cognizant.ormlearn=DEBUG
