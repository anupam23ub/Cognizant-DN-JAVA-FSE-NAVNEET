# ===========================================================================
# orm-learn - default profile (MySQL, as specified in the hands-on documents)
# ===========================================================================
# The documents target a local MySQL "ormlearn" schema. Create it and load the
# SQL scripts in the project's /sql folder (01-schema.sql first, then the data
# scripts) before running. ddl-auto=validate ensures the entity mappings line
# up with those tables without Hibernate altering them.
#
# Prefer not to install MySQL? Run with the bundled H2 profile instead:
#     mvn spring-boot:run -Dspring-boot.run.profiles=h2
# (see application-h2.properties).
# ===========================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ormlearn
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate SQL + binder logging (matches the log inspection steps in the docs)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.cognizant.ormlearn=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
